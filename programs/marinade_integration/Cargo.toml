[package]
name = "marinade_integration"
version = "0.1.0"
description = "Anchor program integrating Marinade Finance liquid staking via CPI"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "marinade_integration"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
marinade-cpi = "0.4.0"
