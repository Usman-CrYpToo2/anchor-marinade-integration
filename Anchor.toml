[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
marinade_integration = "Bfjb9g895pAyGfuFGgkf1JcUzDeKdxYk2sDJC76RZ89r"

[programs.devnet]
marinade_integration = "Bfjb9g895pAyGfuFGgkf1JcUzDeKdxYk2sDJC76RZ89r"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 30000

# The local validator clones Marinade's program and the accounts these
# instructions touch from mainnet-beta, so tests run against real state.
[test.validator]
url = "https://api.mainnet-beta.solana.com"

